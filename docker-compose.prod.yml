services:
  web:
    image: ghcr.io/${ERUMI_IMAGE_OWNER}/erumi-web:${ERUMI_VERSION}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

  api:
    image: ghcr.io/${ERUMI_IMAGE_OWNER}/erumi-api:${ERUMI_VERSION}
    env_file: .env
    environment:
      ERUMI_DATABASE_URL: postgresql+asyncpg://erumi:${POSTGRES_PASSWORD}@postgres:5432/erumi
      ERUMI_REDIS_URL: redis://redis:6379/0
      ERUMI_OBJECT_STORAGE_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    image: ghcr.io/${ERUMI_IMAGE_OWNER}/erumi-api:${ERUMI_VERSION}
    command: python -m app.worker
    env_file: .env
    environment:
      ERUMI_DATABASE_URL: postgresql+asyncpg://erumi:${POSTGRES_PASSWORD}@postgres:5432/erumi
      ERUMI_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: erumi
      POSTGRES_USER: erumi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erumi -d erumi"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  pgdata:
  redis_data:
  minio_data:
