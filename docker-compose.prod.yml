services:
  web:
    image: ghcr.io/ORG/erumi-web:${ERUMI_VERSION}
    restart: unless-stopped

  api:
    image: ghcr.io/ORG/erumi-api:${ERUMI_VERSION}
    env_file: .env
    restart: unless-stopped

  worker:
    image: ghcr.io/ORG/erumi-api:${ERUMI_VERSION}
    command: python -m app.worker
    env_file: .env
    restart: unless-stopped
